# UncivWarcraft: Warcraft wording for messages built into Unciv (English players)
You have won a [victoryType] Victory! = Azeroth is yours! A [victoryType] Victory!
[civilization] has won a [victoryType] Victory! = [civilization] has claimed Azeroth with a [victoryType] Victory!
Your civilization stands above all others! The exploits of your people shall be remembered until the end of civilization itself! = Your people stand above all others! Their deeds will be sung in every hall and longhouse until the last sun sets on Azeroth!
You have been defeated. Your civilization has been overwhelmed by its many foes. But your people do not despair, for they know that one day you shall return - and lead them forward to victory! = You have been defeated. Your people have been overwhelmed by their many foes. But they do not despair, for they know that one day you shall return, and lead them forward to victory!
We have encountered the City-State of [name]! = Our scouts have reached the free city of [name]!
The City-State of [name] has been destroyed! = The free city of [name] has been razed! Only ash and ruin remain.
[cityStateName] gave us a [unitName] as a gift! = [cityStateName] has sent us a [unitName] in token of friendship!
[civName] gave us a [unitName] as gift near [cityName]! = [civName] has sent us a [unitName], now waiting near [cityName]!
We will comply, but our consent is given grudgingly. = We will pay, but we will not forget it.
Your demands are in poor taste. We shall decide this matter on our own. = Your demands insult us. We answer to no one.
Did you really expect us to bend to such brazen demands? = Bow to you? Never.
[cityState] is being attacked by [civName] and asks all major civilizations to help them out by gifting them military units. = [cityState] is under siege by [civName]! Their envoys beg the great powers of Azeroth to send soldiers.
[cityState] is being invaded by Barbarians! Destroy Barbarians near their territory to earn Influence. = Raiders are overrunning the lands of [cityState]! Drive the Barbarians from their borders to earn their favor.
[cityState] is grateful that you killed a Barbarian that was threatening them! = [cityState] raises a cup in your name: the raiders at their gates are slain!
[cityState] is being attacked by [civName]! Kill [amount] of the attacker's military units and they will be immensely grateful. = [cityState] is under attack by [civName]! Slay [amount] of the attacker's soldiers and they will not forget it.
[cityState] is deeply grateful for your assistance in the war against [civName]! = [cityState] will sing of your aid in the war against [civName] for generations!
[cityState] no longer needs your assistance against [civName]. = [cityState] has made its peace with [civName]. Your blades are no longer needed there.
[cityState] cancelled the quests they had given you because you demanded tribute from them. = [cityState] has torn up the tasks they gave you. Their trust left with the tribute you took.
We need you to help us defend against [civName]. Killing [amount] of their military units would slow their offensive. = Stand with us against [civName]! Slay [amount] of their soldiers and their assault will falter.
[civName] assigned you a new quest: [questName]. = [civName] seeks a champion: [questName].
[civName] rewarded you with [influence] influence for completing the [questName] quest. = [civName] honors you with [influence] influence for completing [questName].
[civName] no longer needs your help with the [questName] quest. = [civName] no longer needs a champion for [questName].
The [questName] quest for [civName] has ended. It was won by [civNames]. = The contest of [questName] for [civName] is over. The honor goes to [civNames].
You have broken your Pledge to Protect [civName]! = You have broken your oath to protect [civName]! Word of it spreads quickly.
City-States grow wary of your aggression. The resting point for Influence has decreased by [amount] for [civName]. = The free cities whisper of the warmongering of [civName]. The regard they settle back to falls by [amount].
[civName] is upset that you demanded tribute from [cityState], whom they have pledged to protect! = [civName] is angered that you extorted [cityState], a city sworn to their protection!
[civName] is upset that you attacked [cityState], whom they have pledged to protect! = [civName] is angered that you attacked [cityState], a city sworn to their protection!
[civName] is upset that you attacked [cityState], whom they are allied with! = [civName] is angered that you attacked [cityState], their sworn ally!
[civName] is outraged that you destroyed [cityState], whom they had pledged to protect! = [civName] swears vengeance: you destroyed [cityState], a city sworn to their protection!
[civName] has destroyed [cityState], whom you had pledged to protect! = [civName] has destroyed [cityState], a city you swore to protect!
We have married into the ruling family of [civName], bringing them under our control. = A royal wedding binds the house of [civName] to ours. Their city now flies our banner.
[civName] has married into the ruling family of [civName2], bringing them under their control. = [civName] has wed into the ruling house of [civName2]. That city now flies their banner.
A pleasure to meet you. = Well met.
Very well. = So be it.
Farewell. = Safe travels.
Sounds good! = Agreed!
Not this time. = Not today.
Excellent! = Excellent! May your banners fly high.
How about something else... = Perhaps another offer...
May our nations forever remain united! = May our banners fly together until the end of the age!
Indeed! = Aye!
We will remember this. = This will not be forgotten.
You have violated our bond of trust. This is intolerable! = You have broken your oath to us. That we do not forgive!
You are a scourge upon this earth. I denounce you! = You are a blight upon Azeroth. I denounce you!
You'll pay for this! = You will pay for this in blood!
THIS MEANS WAR! = TO ARMS! THIS MEANS WAR!
Pleasure doing business with you! = A fine trade. May your coffers overflow!
I think not. = Hah! I think not.
That is acceptable. = Agreed. The deal is struck.
We are not interested. = We have no need of that.
